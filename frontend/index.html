<!DOCTYPE html>
<html>
<head>
    <title>Tokamak Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Plasma Disruption Telemetry</h2>
    
    <!-- ADDED: Status and Risk Score Header -->
    <div class="status-header" style="display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333;">
        <div id="status-indicator" class="status-box" style="padding: 10px 20px; border-radius: 4px; font-weight: bold; letter-spacing: 1px;">INITIALIZING...</div>
        <div class="risk-display" style="font-size: 24px; font-family: monospace;">Risk Score: <span id="risk-score">0.0%</span></div>
    </div>
    
    <div class="dashboard-container">
        <!-- Left Side: Stacked Charts -->
        <div class="left-col">
            <div class="chart-wrapper">
                <canvas id="riskChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <!-- Right Side: Action Log -->
        <div class="right-col">
            <h3>Automated Mitigation Log</h3>
            <div id="action-log"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
